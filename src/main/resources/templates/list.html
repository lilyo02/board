<!DOCTYPE HTML>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="keywords" content="" >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="format-detection" content="telephone=no">
    <title>과제 게시판</title>
    <link rel="stylesheet" type="text/css" href="../css/general.css" >
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script type="text/javascript" src="../js/jquery.scrollTo-min.js"></script>
    <script src="../js/layout.js"></script>
    <!--[if IE]>
    <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
</head>
<body>
<div id="wrap">
     <!-- @ CONTAINER -->
    <section id="container" class="sub  new">
        <!-- @ CONTENTS -->
        <fpr id="contents">
            <!-- @ SUB TITLE AREA -->
            <div class="sub-title-area">
                <h2 class="tit">News & Info </h2>
            </div>
			<div class="btn_area">
					<a th:href="@{/board/write}" class="btn_blue_line">글쓰기</a>
              </div>
			<!-- 페이징 처리는 5개씩 해주세요-->
            <table class="news_list">
            <caption>News 리스트</caption>
            <colgroup>
                <col style="width: 10%">
                <col style="width:*">
                <col style="width: 10%">
                <col style="width: 10%">
                <col style="width: 5%">
                <col style="width: 8%">
            </colgroup>
            <thead>
                <tr>
                    <th scope="col">번호</th>
                    <th scope="col">제목</th>
                    <th scope="col">작성자</th>
                    <th scope="col">등록일</th>
                    <th scope="col">조회</th>
                    <th scope="col">첨부</th>
                </tr>
            </thead>
			<tbody>
			    <tr th:each="board : ${boardList.content}">
			        <td th:text="${board.id}"></td>

			        <td class="board_txt">
			            <p>
			                <a th:href="@{/board/view(id=${board.id})}" 
			                   class="ellip"
			                   th:text="${board.title}">
			                </a>
			            </p>
			        </td>

			        <td class="board_"
			            th:text="${board.writer}">
			        </td>

			        <td class="board_date"
			            th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd')}">
			        </td>

			        <td class="board_read"
			            th:text="${board.viewCount}">
			        </td>

			        <td class="board_file">
			            <span class="file_icon">파일다운로드</span>
			        </td>
			    </tr>
			</tbody>
			</table>
            <div class="pagination">
                <a class="prev end" th:if="${!boardList.first}"
				th:href="@{/board/list(page=0)}">첫 페이지</a>
                <a class="prev" th:if="${boardList.hasPrevious()}"
				th:href="@{/board/list(page=${boardList.number-1})}">이전 페이지</a>
                <span th:text="${boardList.number + 1}"></span>
                <a class="next" th:if="${boardList.hasNext()}"
				th:href="@{/board/list(page=${boardList.number+1})}">다음 페이지</a>
                <a class="next end" th:if="${!boardList.last}"
				th:href="@{/board/list(page=${boardList.totalPages-1})}">마지막 페이지</a>
            </div>
            <form th:action="@{/board/list}" method="get" class="find_wrap">
                <select name="type" id="">
                    <option value="title" th:selected="${type == 'title'}">제목</option>
                    <option value="content" th:selected="${type == 'content'}">내용</option>
                </select>
                <input type="text" name="keyword" id="" th:value="${keyword}"  title="검색어 입력" placeholder="검색어 입력">
                <button type="submit" class="btn_gray">검색</button>
            </form>
        </div>
        <!-- CONTENTS @ -->
    </section>
    <!-- CONTAINER @ -->
</div>
</body>
</html>
